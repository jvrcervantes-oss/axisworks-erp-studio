<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>En mantenimiento</title>
<style>
  :root { --fondo: #F5F2EC; --texto: #1F2326; --suave: #5E6469; --linea: #DDD6CA; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #15181A; --texto: #ECE8E1; --suave: #9AA0A5; --linea: #2B3034; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--fondo);
         color: var(--texto); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 460px; text-align: center; }
  h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; font-weight: 600; }
  p { margin: 0 0 10px; color: var(--suave); }
  hr { width: 48px; margin: 26px auto; border: 0; border-top: 1px solid var(--linea); }
</style>
</head>
<body>
<main>
  <h1>En mantenimiento</h1>
  <p>Estamos preparando una nueva versión. Vuelve a entrar más adelante.</p>
  <hr>
  <h1 lang="en">Under maintenance</h1>
  <p lang="en">We are preparing a new version. Please come back later.</p>
</main>
</body>
</html>
